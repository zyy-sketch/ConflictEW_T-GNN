[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conflict-ew-kalman"
version = "1.0.0"
description = "Reproducible conflict early-warning pipeline: Kalman-filter signal extraction + XGBoost with blocked temporal CV"
requires-python = ">=3.13"
# 下限与 requirements.txt/requirements.lock 对齐（论文 Reproducibility 声明）
dependencies = [
    "numpy>=2.5",
    "scipy>=1.14",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "xgboost>=3.0",
    "shap>=0.48",
    "matplotlib>=3.10",
    "PyYAML>=6.0",
    "requests>=2.31",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# F=pyflakes（未用导入/变量、未定义名称）；I=import 排序；E9=语法/运行时级错误
select = ["E9", "F", "I"]
