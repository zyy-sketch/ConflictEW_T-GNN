name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC：全量复现链（含 extended job）

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Deterministic fetch-provenance registry (offline)
        run: python scripts/fetch_external.py --no-fetch

      - name: Test suite (leakage + golden regressions)
        run: python -m pytest -q

      - name: Golden headline values smoke check
        continue-on-error: true   # informational: cross-platform float variance; the strict golden gate is tests/test_golden_values.py under the locked env
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import numpy, xgboost, sklearn
          print(f"env: python {sys.version.split()[0]} / numpy {numpy.__version__} / xgboost {xgboost.__version__} / sklearn {sklearn.__version__}")
          p = Path("artifacts/metrics.json")
          if not p.exists():
              print("metrics.json absent (pipeline not run in CI) - skipping")
          else:
              # metrics.json is flat: auc is a dict {"auc": ..., "ci_lower": ...}; "model" is a string
              m = json.loads(p.read_text(encoding="utf-8"))
              auc = m.get("auc")
              auc = auc.get("auc") if isinstance(auc, dict) else auc
              if auc is None:
                  raise SystemExit("metrics.json present but no auc field - schema drift?")
              d = abs(auc - 0.5447)
              print(f"pipeline-generated AUC = {auc:.4f} (golden 0.5447, |delta| = {d:.4f})")
              if d >= 0.01:
                  print("WARN: drift >= 0.01 - cross-platform library variance expected; "
                        "strict golden gate is tests/test_golden_values.py under the locked environment (requirements.lock).")
              else:
                  print("golden AUC smoke ok")
          PY

  extended-reproduction:
    # 一键全量复现链（--extended：09→10→11→14→15→13→12）——
    # 仅在手动触发/每周计划时运行，避免每次 push 都花 5+ 分钟
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Full reproduction chain (--extended)
        run: python scripts/run_all.py --no-report --no-web --extended
      - name: Verify key artifacts
        run: |
          test -f artifacts/metrics.json
          test -f artifacts/threshold_sensitivity.json
          test -f artifacts/m2_refit_end_to_end.json
          test -f artifacts/calibration_reliability.json
          test -f artifacts/figures/fig1_roc.png
