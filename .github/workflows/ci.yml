name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "xlrd>=2.0.1"

      - name: Deterministic fetch-provenance registry (offline)
        run: python scripts/fetch_external.py --no-fetch

      - name: Test suite (leakage + golden regressions)
        run: python -m pytest -q

      - name: Golden headline values smoke check
        continue-on-error: true   # informational: cross-platform float variance; the strict golden gate is tests/test_golden_values.py under the locked env
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import numpy, xgboost, sklearn
          print(f"env: python {sys.version.split()[0]} / numpy {numpy.__version__} / xgboost {xgboost.__version__} / sklearn {sklearn.__version__}")
          p = Path("artifacts/metrics.json")
          if not p.exists():
              print("metrics.json absent (pipeline not run in CI) - skipping")
          else:
              # metrics.json is flat: auc is a dict {"auc": ..., "ci_lower": ...}; "model" is a string
              m = json.loads(p.read_text(encoding="utf-8"))
              auc = m.get("auc")
              auc = auc.get("auc") if isinstance(auc, dict) else auc
              if auc is None:
                  raise SystemExit("metrics.json present but no auc field - schema drift?")
              d = abs(auc - 0.5447)
              print(f"pipeline-generated AUC = {auc:.4f} (golden 0.5447, |delta| = {d:.4f})")
              if d >= 0.01:
                  print("WARN: drift >= 0.01 - cross-platform library variance expected; "
                        "strict golden gate is tests/test_golden_values.py under the locked environment (requirements.lock).")
              else:
                  print("golden AUC smoke ok")
          PY
