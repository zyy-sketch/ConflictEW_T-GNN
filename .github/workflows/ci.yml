name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "xlrd>=2.0.1"

      - name: Deterministic fetch-provenance registry (offline)
        run: python scripts/fetch_external.py --no-fetch

      - name: Test suite (leakage + golden regressions)
        run: python -m pytest -q

      - name: Golden headline values smoke check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/metrics.json")
          if not p.exists():
              print("metrics.json absent (pipeline not run in CI) - skipping")
          else:
              # metrics.json 为平铺结构：auc 是 {"auc": ..., "ci_lower": ...} 字典（model 字段是字符串）
              m = json.loads(p.read_text(encoding="utf-8"))
              auc = m.get("auc")
              auc = auc.get("auc") if isinstance(auc, dict) else auc
              if auc is None:
                  raise SystemExit("metrics.json present but no auc field - schema drift?")
              print("pipeline-generated AUC:", auc)
              # CI 数据源为联网实时 WDI（无本地缓存），允许小幅漂移；gross-drift（如旧模拟栈 0.538）仍会被拦截
              assert abs(auc - 0.5447) < 0.01, f"AUC drifted beyond 0.01: {auc}"
              print("golden AUC smoke ok (live-WDI tolerance 0.01)")
          PY
