# ConflictEW 军费冲突早期预警系统 — 全局配置
# 超参不落代码：所有可调参数集中于此（PRD §8.4 可维护性）

project:
  name: ConflictEW
  version: v1.0.0
  seed: 20240101          # 全链路固定种子（PRD §8.2 可复现性）
  paper_title: "Multi-Indicator Conflict Early Warning: A Kalman Filter Approach with SIPRI Military Expenditure Data"

paths:
  data_dir: data
  artifact_dir: artifacts
  report_dir: reports
  web_dir: web
  raw_real_file: data/raw_real.json       # WDI 真实抓取缓存（F01）
  simulated_data_file: data/raw_simulated.json   # 模拟降级数据（数据源不可达时）
  external_dir: data/external              # 模拟外部数据目录（simulate.py 管理）
  external_dir_real: data/external_real    # 官方原件转换产物（R-8；见 PROVENANCE.md）
  panel_file: data/panel.csv               # 国家×年面板（F04）
  manifest_file: data/data_manifest.json   # 数据清单（F03）
  features_file: data/features.csv         # 6 因子特征（F06）
  kalman_signals_file: data/kalman_signals.csv   # Kalman 信号（F05）
  kalman_params_file: data/kalman_params.csv     # Kalman 参数（F05）
  oos_file: artifacts/oos_predictions.csv  # OOS 概率（F07）
  shap_file: artifacts/shap_values.csv     # SHAP 归因（F08）
  shap_importance_file: artifacts/shap_importance.csv
  metrics_file: artifacts/metrics.json     # 回测指标（F09）
  model_file: artifacts/xgb_model.json     # 序列化模型
  params_file: artifacts/xgb_params.json   # 模型超参
  alerts_file: artifacts/alerts.json       # 预警记录（F15）
  alert_history_file: artifacts/alert_history.json
  web_data_file: web/data/app_data.js      # 前端数据导出
  run_log_file: artifacts/run_log.jsonl    # 逐阶段 run-log
  threshold_config_section: eval.thresholds  # 阈值写入 config.yaml 的路径（F16）

data:
  external_source: real                 # real=官方原件转换产物 | simulated=模拟占位（P0-7）
  wdi:
    base_url: https://api.worldbank.org/v2/country/all/indicator/
    indicators:                          # 经济协变量（F6 F3 经济压力因子）
      mil_expense: MS.MIL.XPND.CD        # 军费支出（美元现价）
      gdp_growth: NY.GDP.MKTP.KD.ZG      # GDP 增速
      inflation: FP.CPI.TOTL.ZG          # 通胀率
      unemployment: SL.UEM.TOTL.ZS       # 失业率
    format: "?format=json&per_page=20000&date={start}:{end}"
    timeout_sec: 15
    retries: 2
    cache_file: data/raw_real.json
    simulated_fallback: false            # WDI 不可达时硬报错（R1 裁决 2026-11-15 采纳①：禁止静默降级；演示模式可临时改 true）
  panel:
    min_years: 20                        # 覆盖≥20 年的国家才纳入面板（§8.2）
    start_year: 1970
    end_year: 2024
  labels:
    lookahead_months: 12                 # y=1 ⟺ 后 12 个月内新冲突 onset（§8.2）
    cow_standards: [use_of_force, battle_deaths_25, state_party_2, incompatibility]
    positive_rate_target: 0.025          # 正样本率 ~2-3%

model:
  xgb:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    l2_reg: 1.0
    min_child_weight: 2
    scale_pos_weight_auto: true          # 稀有事件校正（F07）
    random_state: 20240101
  cv:
    n_folds: 5                           # blocked expanding-window CV（F07）
    train_start: 1990
    cv_start: 1990
    test_start: 2015                     # 严格 out-of-sample
    test_end: 2024
    early_stopping_rounds: 30
    group_by_country: true               # blocked：按国家分组保时序
  shap:
    local_accuracy_tol: 0.000001            # φ₀+Σφⱼ=logit(p) 容差（F08）
    substantial_threshold: 0.05             # |φ|<0.05 非实质驱动因子（F08）

eval:
  thresholds:                            # 三级预警阈值（F16 可配置）
    high: 0.7
    mid: 0.5
  calibration: isotonic                  # Platt/isotonic 校准，训练期拟合（§8.2）
  bootstraps: 1000                       # bootstrap CI（R3）
  fdr_alpha: 0.05                        # Benjamini-Hochberg FDR 校正
  ci_level: 0.95
  youden_beta: 2.0                       # 阈值选择 Fβ=2（§8.2）

alert:
  enabled: true
  notify_channels: [in-app]              # 站内通知；邮件需配置后启用
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    from_addr: ""
    to_addrs: []
  agent_checklist:                       # 高风险触发 Agent 核查清单（F15）
    - "核验军费异常信号 e* 是否连续 ≥2 年超过 2σ"
    - "检查邻国军费增速差是否持续为正（军备竞赛迹象）"
    - "复核经济压力因子（GDP 增速下滑 / 通胀高企 / 失业上升）"
    - "确认政治不稳信号（Polity 变化 / V-Dem LDI 变化）"
    - "核对领土争端（ICOW）与同盟变更（ATOP）事件"
    - "人工复核概率与 SHAP 归因后决定是否升级处置"

report:
  supported_types: [monthly, quarterly, custom]
  default_type: quarterly
  self_contained: true                   # 自包含 HTML（内嵌 base64，F18）
  formats: [html, pdf]

llm:
  backend: rule-template                 # rule-template | llama3 | gpt4（Phase2 切换）
  mock_max_latency_ms: 1000              # Mock 推理链延迟 ≤1s（§13.4）
  api_base: ""
  model: ""

web:
  map_source: datav-geoatlas             # 合规世界地图（中国标准）
  max_compare_countries: 5               # 国家对比上限（F12/§7.5 表单验证）
  year_min: 1990
  year_max: 2024

security:
  xss_escape: true                       # 用户输入转义防 XSS（§8.4）
